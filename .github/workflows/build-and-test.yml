name: Build Netscape APK

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # This is the secret to speed: it handles all the caching for you
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission
        run: chmod +x gradlew

      # Added flags to make the build finish as fast as possible
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache --configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netscape-Build
          path: stream-chat-android-ui-components-sample/build/outputs/apk/demo/debug/*.apk
