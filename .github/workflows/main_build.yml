name: Zetra Engine Production Build

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Zetra Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Zetra Modules
        # We EXCLUDE the broken sample module to prevent the resource linking crash
        # This ensures the core engine and WhatsApp-level features build correctly
        run: >
          ./gradlew assembleDebug 
          -x :stream-chat-android-ui-components-sample:processDemoDebugResources 
          --no-daemon 
          --parallel 
          --build-cache

      - name: Archive Zetra APKs
        uses: actions/upload-artifact@v4
        with:
          name: Zetra-Build-Output
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
