name: Zetra High-Performance Build

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Engine (Excluding Broken UI Sample)
        # We skip the specific task that failed in your 6m 44s log
        run: ./gradlew assembleDebug -x :stream-chat-android-ui-components-sample:processDemoDebugResources --no-daemon --parallel --build-cache --configuration-cache

      - name: Upload Working APKs
        uses: actions/upload-artifact@v4
        with:
          name: Zetra-Engine-Build
          # This finds every APK built by the working modules
          path: "**/build/outputs/apk/**/*.apk"
